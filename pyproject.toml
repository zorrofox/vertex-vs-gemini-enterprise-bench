[project]
name = "discovery-api"
version = "0.1.0"
description = "GCP Discovery Engine vs Vertex AI OpenAI-compatible proxy & benchmark"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.120.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "google-auth>=2.29.0",
    "google-genai>=1.0.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "plotly>=5.22.0",
    "streamlit>=1.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
